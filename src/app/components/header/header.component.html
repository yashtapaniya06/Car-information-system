<div class="header">
    <div class="section1">
        <h1>
            <a class="logo" routerLink="/">
                <img src="assets/assets/Logo.png" class="LogoImg" alt="Logo" routerLink="/" />
            </a>
        </h1>
    </div>

    <div>
        <ul class="links">
            <li>
                <a routerLink="/" class="link" routerLinkActive="active">Home</a>
            </li>
            <li>
                <a routerLink="/about" class="link" routerLinkActive="active">About</a>
            </li>
            <li>
                <a routerLink="/contact" class="link" routerLinkActive="active">Contact Us</a>
            </li>
            <li>
                <a routerLink="/cars" class="link" routerLinkActive="active">Car</a>
            </li>
            @if (isAdmin) {
            <li>
                <a routerLink="/admin" class="link" routerLinkActive="active">Dashboard</a>
            </li>
            }
        </ul>
    </div>

    <div class="section2">
        <ul class="links">
            @if (isLoggedIn) {
            <div class="profile">
                <div class="profile-trigger" (click)="toggleMenu()">
                    <div class="avatar">
                        <!-- Placeholder for Avatar image or initial -->
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                    </div>
                    <span class="HelloUser">Hello, {{ username }}</span>
                </div>

                <!-- Dropdown Menu -->
                @if (isMenuOpen) {
                <div class="menu-dropdown">
                    <div class="menu-arrow"></div>
                    <div class="menu-item" (click)="handlerLogout()">
                        <div class="menu-link">
                            <svg class="menu-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path
                                    d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
                            </svg>
                            Logout
                        </div>
                    </div>
                </div>
                }
            </div>
            } @else {
                <li>
                    <span (click)="loginOpen = true" class="hoverEffct">Login</span>
                </li>
                <li>
                    <a routerLink="/signUp" class="Btn">Sign Up</a>
                </li>
            }
        </ul>
    </div>
</div>

<!-- Login Modal Overlay -->
@if (loginOpen) {
<div class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" (click)="loginOpen = false">&times;</button>
        <!-- Assuming app-login-modal is the selector for the converted LoginModal component -->
        <!-- You would need to implement the LoginModalComponent separately -->
        <app-login-modal (closeModal)="onLoginClose()"></app-login-modal>
    </div>
</div>
}

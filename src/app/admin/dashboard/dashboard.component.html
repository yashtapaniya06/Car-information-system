<div class="dashboard-container">
  <!-- Header Section -->
  <div class="dashboard-header">
    <div class="header-content">
      <h1 class="dashboard-title">
        <span class="title-icon">🚗</span>
        Admin Dashboard
      </h1>
      <p class="dashboard-subtitle">Manage your automotive empire</p>
    </div>
    <div class="header-decoration">
      <div class="decoration-circle circle-1"></div>
      <div class="decoration-circle circle-2"></div>
      <div class="decoration-circle circle-3"></div>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading) {
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading dashboard data...</p>
  </div>
  } @else {
  <!-- Stats Grid -->
  <div class="stats-grid">
    <!-- Users Card -->
    <div
      class="stat-card users-card"
      [class.hovered]="hoveredCard === 'users'"
      (click)="goToUsers()"
      (mouseenter)="onMouseEnter('users')"
      (mouseleave)="onMouseLeave()"
    >
      <div class="card-background">
        <div class="card-pattern"></div>
      </div>
      <div class="card-content">
        <div class="card-icon">
          <div class="icon-container users-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
        </div>
        <div class="card-info">
          <h3 class="card-title">Total Users</h3>
          <p class="card-value">{{ userCount }}</p>
          <div class="card-trend">
            <span class="trend-indicator positive">↑</span>
            <span class="trend-text">Active users</span>
          </div>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Cars Card -->
    <div
      class="stat-card cars-card"
      [class.hovered]="hoveredCard === 'cars'"
      (click)="goToCarData()"
      (mouseenter)="onMouseEnter('cars')"
      (mouseleave)="onMouseLeave()"
    >
      <div class="card-background">
        <div class="card-pattern"></div>
      </div>
      <div class="card-content">
        <div class="card-icon">
          <div class="icon-container cars-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"></path>
              <path d="M19 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"></path>
              <path d="M12 19H5V6l3-3h8l3 3v7"></path>
              <path d="M8 6h8"></path>
            </svg>
          </div>
        </div>
        <div class="card-info">
          <h3 class="card-title">Car Collection</h3>
          <p class="card-value">{{ carCount }}</p>
          <div class="card-trend">
            <span class="trend-indicator positive">↑</span>
            <span class="trend-text">Total vehicles</span>
          </div>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Ratings Card -->
    <div
      class="stat-card ratings-card"
      [class.hovered]="hoveredCard === 'ratings'"
      (click)="goToRatings()"
      (mouseenter)="onMouseEnter('ratings')"
      (mouseleave)="onMouseLeave()"
    >
      <div class="card-background">
        <div class="card-pattern"></div>
      </div>
      <div class="card-content">
        <div class="card-icon">
          <div class="icon-container ratings-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
        </div>
        <div class="card-info">
          <h3 class="card-title">Ratings & Reviews</h3>
          <p class="card-value">Analytics</p>
          <div class="card-trend">
            <span class="trend-indicator neutral">→</span>
            <span class="trend-text">View insights</span>
          </div>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <h2 class="section-title">Quick Actions</h2>
    <div class="actions-grid">
      <button class="action-btn primary" (click)="goToUsers()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span>Add User</span>
      </button>
      <button class="action-btn secondary" (click)="goToCarData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"></path>
          <path d="M19 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"></path>
          <path d="M12 19H5V6l3-3h8l3 3v7"></path>
          <line x1="12" y1="6" x2="12" y2="19"></line>
          <line x1="9" y1="6" x2="9" y2="19"></line>
          <line x1="15" y1="6" x2="15" y2="19"></line>
        </svg>
        <span>Add Car</span>
      </button>
      <button class="action-btn tertiary" (click)="goToRatings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>View Reports</span>
      </button>
    </div>
  </div>
  }
</div>

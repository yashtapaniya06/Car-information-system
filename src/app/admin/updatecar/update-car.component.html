<div class="update-car-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">
        <span class="title-icon">🔧</span>
        Update Car
      </h1>
      <p class="page-subtitle">Update vehicle information</p>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading) {
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading car information...</p>
  </div>
  } @else {
  <!-- Form Container -->
  <div class="form-container">
    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="update-form">
      <div class="form-grid">
        <!-- Left Column -->
        <div class="form-left">
          <!-- Model Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🏷️</span>
              Model:
            </label>
            <input type="text" formControlName="model" class="form-input" />
          </div>

          <!-- Brand Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🏢</span>
              Brand:
            </label>
            <input type="text" formControlName="brand" class="form-input" />
          </div>

          <!-- Price Range Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">💰</span>
              Price Range:
            </label>
            <select formControlName="priceRange" class="form-select">
              <option value="">Select Price Range</option>
              <option value="1-5">1-5 Lakhs</option>
              <option value="5-10">5-10 Lakhs</option>
              <option value="10-15">10-15 Lakhs</option>
              <option value="15-20">15-20 Lakhs</option>
              <option value="20-30">20-30 Lakhs</option>
              <option value="30-50">30-50 Lakhs</option>
              <option value="50+">50+ Lakhs</option>
            </select>
          </div>

          <!-- Year Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">📅</span>
              Year:
            </label>
            <input type="number" formControlName="year" class="form-input" />
          </div>

          <!-- Fuel Type Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">⛽</span>
              Fuel Types (Select all that apply):
            </label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" 
                  [checked]="isFuelTypeSelected('Electric')" 
                  (change)="onFuelTypeChange($event, 'Electric')" />
                <span class="checkbox-text">⚡ Electric</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" 
                  [checked]="isFuelTypeSelected('Petrol')" 
                  (change)="onFuelTypeChange($event, 'Petrol')" />
                <span class="checkbox-text">⛽ Petrol</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" 
                  [checked]="isFuelTypeSelected('Diesel')" 
                  (change)="onFuelTypeChange($event, 'Diesel')" />
                <span class="checkbox-text">🛢️ Diesel</span>
              </label>
            </div>
          </div>

          <!-- Mileage Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">📊</span>
              Mileage:
            </label>
            <input type="text" formControlName="mileage" class="form-input" />
          </div>
        </div>

        <!-- Right Column -->
        <div class="form-right">
          <!-- Transmission Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">⚙️</span>
              Transmission:
            </label>
            <select formControlName="transmission" class="form-input">
              <option value="">Select Transmission</option>
              <option value="Manual">Manual</option>
              <option value="Automatic">Automatic</option>
            </select>
          </div>

          <!-- Engine Capacity Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🔧</span>
              Engine Capacity:
            </label>
            <input type="text" formControlName="engineCapacity" class="form-input" />
          </div>

          <!-- Seating Capacity Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">👥</span>
              Seating Capacity:
            </label>
            <input type="number" formControlName="seatingCapacity" class="form-input" />
          </div>

          <!-- Body Type Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🚗</span>
              Body Type:
            </label>
            <select formControlName="bodyType" class="form-input">
              <option value="">Select Body Type</option>
              <option value="Sedan">Sedan</option>
              <option value="SUV">SUV</option>
              <option value="Hatchback">Hatchback</option>
              <option value="Coupe">Coupe</option>
              <option value="Convertible">Convertible</option>
            </select>
          </div>

          <!-- Boot Space Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🧳</span>
              Boot Space:
            </label>
            <input type="number" formControlName="bootSpace" class="form-input" />
          </div>

          <!-- Safety Features Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🛡️</span>
              Safety Features:
            </label>
            <textarea formControlName="safetyFeatures" class="form-textarea" rows="3"></textarea>
          </div>

          <!-- Features Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">✨</span>
              Features:
            </label>
            <textarea formControlName="features" class="form-textarea" rows="3"></textarea>
          </div>

          <!-- Warranty Field -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">📋</span>
              Warranty:
            </label>
            <input type="text" formControlName="warranty" class="form-input" />
          </div>

          <!-- Description Field -->
          <div class="form-group full-width">
            <label class="form-label">
              <span class="label-icon">📝</span>
              Description:
            </label>
            <textarea formControlName="description" class="form-textarea" rows="4" placeholder="Enter detailed description about the car, its features, performance, etc."></textarea>
          </div>

          <!-- Image URLs -->
          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🖼️</span>
              Image 1 URL:
            </label>
            <input type="text" formControlName="image1" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label">
              <span class="label-icon">🖼️</span>
              Image 2 URL:
            </label>
            <input type="text" formControlName="image2" class="form-input" />
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" [disabled]="updateForm.invalid">
            <span class="btn-icon">🔧</span>
            <span class="btn-text">Update Car</span>
          </button>
        </div>
      </div>
    </form>
  </div>
  }
</div>
